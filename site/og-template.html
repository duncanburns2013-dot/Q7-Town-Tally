<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Question 7 by Town: social preview</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://use.typekit.net" crossorigin>
<link rel="stylesheet" href="https://use.typekit.net/irk1bar.css">
<style>
/* 1200x630 social card, rendered to og.png by scripts/render_og.ps1.
   Same tokens and the same diverging ramp as the page (build asserts the DIV match). */
:root {
  --bg: #e9ebea; --card: #ffffff; --line: #cdd3d1; --ink: #0b1113; --ink-2: #3e4a4d; --muted: #5a6467;
  --yes: #2a6b44; --no: #680a1d; --amber: #b07c20;
  --font-display: "halyard-display", system-ui, sans-serif;
  --font-body: "halyard-text", system-ui, sans-serif;
  --font-data: "ibm-plex-mono", ui-monospace, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); }
.card { position: absolute; inset: 36px 40px 40px 40px; display: grid; grid-template-columns: 430px 1fr; gap: 0;
  border-top: 6px solid var(--ink); }
.left { padding: 28px 34px 0 0; display: flex; flex-direction: column; }
.eyebrow { font-family: var(--font-data); font-size: 15px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); line-height: 1.5; }
.eyebrow .flag { color: var(--amber); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 66px; line-height: .98; letter-spacing: -.035em; margin-top: 18px; }
.res { margin-top: auto; padding-bottom: 6px; }
.row { display: grid; grid-template-columns: 1fr 1fr; align-items: end; }
.side { font-family: var(--font-data); font-size: 15px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
.pct { font-family: var(--font-data); font-size: 60px; font-weight: 600; letter-spacing: -.04em; line-height: 1; margin-top: 4px; }
.no { color: var(--no); } .yes { color: var(--yes); }
.bar { display: flex; gap: 3px; height: 14px; margin-top: 16px; }
.bar span { display: block; height: 100%; }
.meta { font-family: var(--font-data); font-size: 16px; color: var(--ink-2); margin-top: 14px; line-height: 1.5; }
.right { background: var(--card); border-left: 1px solid var(--line); position: relative; padding: 18px 18px 14px; display: flex; flex-direction: column; }
#map { width: 100%; flex: 1; display: block; }
#map path { stroke: #ffffff; stroke-width: .45; stroke-linejoin: round; }
.legend { display: flex; align-items: center; gap: 12px; font-family: var(--font-data); font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.legend .ramp { flex: 0 0 300px; height: 10px; }
.legend .note { margin-left: auto; color: var(--muted); font-weight: 400; letter-spacing: .02em; text-transform: none; }
</style>
</head>
<body>
<div class="card">
  <div class="left">
    <div class="eyebrow">Massachusetts State Election<br>Nov. 3, 2026 &middot; <span class="flag">Unofficial</span></div>
    <h1>Question 7, town by town</h1>
    <div class="res">
      <div class="row"><span class="side no">No</span><span class="side yes">Yes</span></div>
      <div class="row"><span class="pct no" id="np"></span><span class="pct yes" id="yp"></span></div>
      <div class="bar" id="bar"></div>
      <div class="meta" id="meta"></div>
    </div>
  </div>
  <div class="right">
    <svg id="map" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <defs>
        <pattern id="nores" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="5" height="5" fill="#ffffff"></rect><line x1="0" y1="0" x2="0" y2="5" stroke="#c3cbc8" stroke-width="2.4"></line>
        </pattern>
      </defs>
    </svg>
    <div class="legend"><span class="no">No</span><span class="ramp" id="ramp"></span><span class="yes">Yes</span><span class="note">Yes share by town, 20&ndash;80%</span></div>
  </div>
</div>
<script>
const DATA = /*__DATA__*/null;
const T = DATA.towns;
const DIV = ['#680a1d', '#a81733', '#bf595f', '#d28b8c', '#e1bdbc', '#eceeed', '#bbccc0', '#8bab95', '#5c8b6c', '#2a6b44', '#173d27'];
const hex2rgb = h => [1, 3, 5].map(o => parseInt(h.slice(o, o + 2), 16));
const rgb2hex = c => '#' + c.map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
function ramp(stops, t) {
  t = Math.max(0, Math.min(1, t));
  const s = t * (stops.length - 1), i = Math.min(stops.length - 2, Math.floor(s)), f = s - i;
  const a = hex2rgb(stops[i]), b = hex2rgb(stops[i + 1]);
  return rgb2hex(a.map((v, k) => v + (b[k] - v) * f));
}
const fmt = new Intl.NumberFormat('en-US');
const svg = document.getElementById('map');
svg.setAttribute('viewBox', `0 0 ${DATA.w} ${DATA.h}`);
let y = 0, n = 0, noT = 0, yesT = 0, na = 0;
for (const t of T) {
  y += t.y; n += t.no;
  const tot = t.y + t.no;
  if (!tot) na++; else if (t.no > t.y) noT++; else if (t.y > t.no) yesT++;
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', t.p);
  p.setAttribute('fill', tot ? ramp(DIV, (100 * t.y / tot - 20) / 60) : 'url(#nores)');
  svg.appendChild(p);
}
const tot = y + n, np = 100 * n / tot, yp = 100 * y / tot;
document.getElementById('np').textContent = np.toFixed(1) + '%';
document.getElementById('yp').textContent = yp.toFixed(1) + '%';
document.getElementById('bar').innerHTML = `<span style="width:${np}%;background:var(--no)"></span><span style="width:${yp}%;background:var(--yes)"></span>`;
document.getElementById('meta').innerHTML = `Lost by ${fmt.format(n - y)} votes<br>${noT} towns No &middot; ${yesT} Yes${na ? ` &middot; ${na} not reported` : ''}`;
document.getElementById('ramp').style.background = `linear-gradient(90deg, ${DIV.join(', ')})`;
document.fonts.ready.then(() => document.body.dataset.ready = '1');
</script>
</body>
</html>
